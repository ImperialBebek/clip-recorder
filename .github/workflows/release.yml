name: Release

# Push a tag matching Cargo.toml's version (v0.1.0) to publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Built on the oldest supported Ubuntu so the binary runs on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - name: Install build dependencies
        run: |
          sudo apt-get update
          # The runner image ships libunwind-14-dev, which conflicts with
          # libunwind-dev that libgstreamer1.0-dev needs.
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y --no-install-recommends pkg-config libunwind-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libfontconfig1-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist/clip-recorder
          cp target/release/clip-recorder assets/clip-recorder.desktop assets/install.sh README.md dist/clip-recorder/
          cd dist
          tar -czf clip-recorder-x86_64-linux.tar.gz clip-recorder
          sha256sum clip-recorder-x86_64-linux.tar.gz > clip-recorder-x86_64-linux.tar.gz.sha256
      - name: Build AppImage
        env:
          APPIMAGETOOL_VERSION: "1.9.1"
          APPIMAGETOOL_SHA256: "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
        run: |
          curl -fsSLo /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          echo "$APPIMAGETOOL_SHA256  /tmp/appimagetool" | sha256sum -c
          chmod +x /tmp/appimagetool
          appdir=dist/clip-recorder.AppDir
          mkdir -p "$appdir/usr/bin"
          cp target/release/clip-recorder "$appdir/usr/bin/clip-recorder"
          sed 's/^Icon=.*/Icon=clip-recorder/' assets/clip-recorder.desktop > "$appdir/clip-recorder.desktop"
          cp assets/clip-recorder.svg "$appdir/clip-recorder.svg"
          cp assets/clip-recorder.svg "$appdir/.DirIcon"
          cat > "$appdir/AppRun" << 'EOF'
          #!/bin/sh
          APPDIR="${APPDIR:-$(dirname "$(readlink -f "$0")")}"
          exec "$APPDIR/usr/bin/clip-recorder" "$@"
          EOF
          chmod +x "$appdir/AppRun"
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run \
            "$appdir" dist/clip-recorder-x86_64.AppImage
          (cd dist && sha256sum clip-recorder-x86_64.AppImage > clip-recorder-x86_64.AppImage.sha256)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/clip-recorder-x86_64-linux.tar.gz \
            dist/clip-recorder-x86_64-linux.tar.gz.sha256 \
            dist/clip-recorder-x86_64.AppImage \
            dist/clip-recorder-x86_64.AppImage.sha256 \
            --title "Clip Recorder $GITHUB_REF_NAME" --generate-notes
