[package]
name = "clip-recorder"
version = "0.2.0"
edition = "2021"
description = "Ultra-lightweight game clip recorder for Linux: PipeWire rolling buffer, hardware encoding, Alt+S to save"
license = "MIT"

[dependencies]
anyhow = "1"
futures-util = { version = "0.3", default-features = false }
gstreamer = { version = "0.25", features = ["v1_20"] }
gstreamer-app = { version = "0.25", features = ["v1_20"] }
lexopt = "0.3"
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "io-util", "signal", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14", default-features = false, features = ["tokio", "screencast", "global_shortcuts"] }
evdev = "0.13"
libc = "0.2"
smithay-client-toolkit = { version = "0.19", default-features = false }
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit-wayland", "backend-winit-x11", "renderer-femtovg", "renderer-software", "software-renderer-systemfonts", "unstable-winit-030"] }

[build-dependencies]
slint-build = "1.19"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
